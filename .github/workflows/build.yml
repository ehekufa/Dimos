name: Build DimaOS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm xorriso git

      - name: Fetch Limine and LVGL
        run: make deps

      - name: Build DimaOS ELF
        run: make -j$(nproc) elf

      - name: Build DimaOS ISO
        run: make iso

      - name: Upload dimaos.iso artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimaos-iso
          path: dimaos.iso
